name: GitHub activity card

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/github-activity.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/github-activity.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  refresh:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: github-activity-refresh
      cancel-in-progress: false
    env:
      ACTIVITY_USERNAME: khanhvinhnguyen
      ACTIVITY_DISPLAY_NAME: Vinh Nguyễn
      ACTIVITY_START_DATE: '2017-08-21'
      ACTIVITY_TIMEZONE: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Generate card from the public contribution calendar
        run: python3 scripts/github_activity.py
      - name: Commit the card and its versioned README link together
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-streak.svg assets/github-activity.svg assets/github-activity.json README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh GitHub activity card'
          git push origin HEAD:main
